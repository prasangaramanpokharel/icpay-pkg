[package]
name = "icpay-cron"
version = "0.1.0"
edition = "2021"
description = "icCron Rust SDK — Trigger and manage autonomous on-chain cron jobs on the Internet Computer"
license = "MIT"
repository = "https://github.com/prasangaramanpokharel/ICPay"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
