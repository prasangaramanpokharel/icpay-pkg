[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icpay-cron"
version = "1.0.0"
description = "icCron Python SDK — Trigger and manage autonomous on-chain cron jobs on the Internet Computer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["icp", "internet-computer", "cron", "scheduler", "webhooks", "icpay", "iccron"]
dependencies = ["requests>=2.28.0"]

[project.urls]
Homepage = "https://icpay.app/iccron"
Repository = "https://github.com/prasangaramanpokharel/ICPay"

[tool.setuptools.packages.find]
include = ["icpay_cron*"]
